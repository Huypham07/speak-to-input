services:
  whisper-service:
    build:
      context: ./whisper/
      dockerfile: Dockerfile
    container_name: whisper-service
    ports:
      - "8080:8080"
    volumes:
      - whisper-models:/opt/whisper.cpp/models
    environment:
      - TZ=Asia/Ho_Chi_Minh
    restart: unless-stopped
    networks:
      - speak-to-input-network
      - share_network

  api-service:
    build:
      context: ./api/src/
      dockerfile: Dockerfile
    container_name: speak-to-input
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env
    working_dir: /app
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      whisper-service:
        condition: service_started
    networks:
      - speak-to-input-network
      - share_network

volumes:
  whisper-models:
    driver: local

networks:
  speak-to-input-network:
    driver: bridge
  share_network:
    external: true
